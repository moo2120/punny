<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fun with Reading - Full Curriculum (63 Stories)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- แถบนำทางด้านบน -->
  <header class="top-nav">
    <button class="nav-btn" onclick="showScreen('worldMapScreen')">🗺️ Map</button>
    <div class="stars-counter">⭐ <span id="totalStars">0</span></div>
    <button class="nav-btn pet-nav-btn" onclick="openPetMode()">🐾 My Pet</button>
  </header>

  <canvas id="confettiCanvas"></canvas>

  <main class="app-container">

    <!-- 1. แผนที่ 11 หน่วยการเรียนรู้ -->
    <section id="worldMapScreen" class="screen active">
      <div class="header-box">
        <h1>🌟 Storyland World 🌟</h1>
        <p>Complete All 63 Missions from Fun with Reading!</p>
      </div>
      <div class="islands-grid" id="islandsContainer"></div>
    </section>

    <!-- 2. หน้ารายชื่อนิทานในแต่ละหน่วย -->
    <section id="storySelectScreen" class="screen">
      <button class="back-pill" onclick="showScreen('worldMapScreen')">⬅️ Back to Map</button>
      <h2 id="currentUnitTitle" class="unit-title">Unit</h2>
      <div class="stories-grid" id="storiesContainer"></div>
    </section>

    <!-- 3. หน้านิทาน + คาราโอเกะ -->
    <section id="storyReaderScreen" class="screen">
      <button class="back-pill" onclick="showScreen('storySelectScreen')">⬅️ Back</button>
      
      <div class="reader-card">
        <div class="story-illustration" id="storyEmojiHero">📖</div>
        <h2 id="readerTitle">Story Title</h2>
        
        <div class="story-text-container" id="storyLinesBox"></div>

        <div class="audio-controls">
          <button class="btn-giant play-btn" onclick="readStoryAloud()">
            🔊 Read to Me
          </button>
        </div>

        <button class="btn-giant next-mission-btn" onclick="startStoryMission()">
          🎮 Play Mission! ➔
        </button>
      </div>
    </section>

    <!-- 4. หน้าทำภารกิจ/มินิเกม -->
    <section id="gamePlayScreen" class="screen">
      <div class="game-top-bar">
        <span id="gameProgressTag" class="mission-tag">Question 1/4</span>
        <button class="btn-close" onclick="exitToReader()">✕</button>
      </div>

      <div class="mission-card">
        <div class="prompt-box">
          <h3 id="gameInstruction">Instruction</h3>
          <button class="tts-small-btn" onclick="speakInstruction()">🔊</button>
        </div>

        <div id="dynamicGameArea" class="game-playfield"></div>
      </div>
    </section>

    <!-- 5. โหมดทบทวนคำศัพท์และให้อาหารสัตว์เลี้ยง -->
    <section id="petScreen" class="screen">
      <button class="back-pill" onclick="showScreen('worldMapScreen')">⬅️ Back to Map</button>
      <div class="pet-card">
        <h2>🐾 Word Pet Sanctuary</h2>
        <div class="pet-avatar-stage">
          <div id="petAvatar" class="pet-avatar">🐶</div>
          <div class="pet-bubble" id="petSpeech">Feed me words!</div>
        </div>

        <div class="pet-stats">
          <div class="stat-bar">
            <span>❤️ Happiness</span>
            <div class="bar-outer"><div id="petHeartBar" class="bar-inner" style="width: 50%;"></div></div>
          </div>
        </div>

        <div class="vocab-game-box">
          <h3>Tap the word you hear!</h3>
          <button class="btn-speaker" onclick="playVocabAudioPrompt()">🔊 Say Word</button>
          <div class="vocab-bubble-row" id="vocabChoicesBox"></div>
        </div>
      </div>
    </section>

  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
