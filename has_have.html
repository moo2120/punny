<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมผจญภัย Has หรือ Have? (สำหรับ ป.1)</title>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Mali', cursive, sans-serif;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* การ์ดเกมหลัก */
    .game-card {
      background: #ffffff;
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      width: 100%;
      max-width: 550px;
      padding: 24px;
      text-align: center;
      position: relative;
      border: 5px solid #FFE082;
    }

    /* แถบหัวเรื่องและคาถาน่ารู้ */
    .header-tag {
      background: #FF8A80;
      color: white;
      display: inline-block;
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .cheat-sheet {
      background: #FFF9C4;
      border-radius: 16px;
      padding: 8px 12px;
      font-size: 0.95rem;
      color: #5D4037;
      margin-bottom: 16px;
    }

    .progress-bar-container {
      background: #E0E0E0;
      border-radius: 12px;
      height: 14px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      background: linear-gradient(90deg, #4CAF50, #8BC34A);
      height: 100%;
      width: 5%;
      transition: width 0.3s ease;
    }

    /* ตัวการ์ตูน Emoji เด้งดึ๋ง */
    .emoji-display {
      font-size: 5rem;
      margin: 10px 0;
      display: inline-block;
      animation: bounce 1.8s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-15px) scale(1.08); }
    }

    /* ประโยคคำถาม */
    .question-box {
      font-size: 1.8rem;
      font-weight: bold;
      color: #37474F;
      margin: 15px 0 25px 0;
      line-height: 1.4;
    }

    .pronoun-highlight {
      color: #FF5722;
      text-decoration: underline wavy #FFAB91;
    }

    .blank-space {
      display: inline-block;
      min-width: 90px;
      border-bottom: 4px dashed #FFCA28;
      color: #1E88E5;
      padding: 0 8px;
    }

    /* ปุ่มตัวเลือก */
    .choices-container {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .btn-choice {
      flex: 1;
      padding: 16px 20px;
      font-size: 1.8rem;
      font-weight: bold;
      border-radius: 24px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
      transition: all 0.1s ease;
      color: white;
    }

    .btn-choice:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
    }

    .btn-has {
      background: #42A5F5;
    }

    .btn-have {
      background: #66BB6A;
    }

    /* หน้าต่าง Popup เฉลย */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 999;
    }

    .popup-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .popup-content {
      background: white;
      border-radius: 28px;
      padding: 25px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      transform: scale(0.7);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .popup-overlay.active .popup-content {
      transform: scale(1);
    }

    .popup-icon {
      font-size: 4rem;
      margin-bottom: 8px;
    }

    .popup-title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .popup-desc {
      font-size: 1.2rem;
      color: #455A64;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .popup-desc b {
      color: #D81B60;
    }

    .btn-next {
      background: #FFA726;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 0 #F57C00;
      width: 100%;
    }

    .btn-next:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #F57C00;
    }

    /* จบเกม */
    .finish-screen {
      display: none;
    }
  </style>
</head>
<body>

  <div class="game-card">
    
    <!-- หน้าเล่นเกม -->
    <div id="quiz-screen">
      <div class="header-tag">✨ ข้อที่ <span id="current-q-num">1</span> / 20 ✨</div>
      
      <div class="cheat-sheet">
        💡 <b>จำง่าย ๆ:</b> He/She/It ใช้ <b>has</b> | I/You/We/They ใช้ <b>have</b>
      </div>

      <div class="progress-bar-container">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <!-- รูปน่ารักประจำข้อ -->
      <div>
        <span class="emoji-display" id="question-emoji">⚽</span>
      </div>

      <!-- ประโยคคำถาม -->
      <div class="question-box">
        <span id="pronoun" class="pronoun-highlight">He</span>
        <span class="blank-space" id="blank-answer">?</span>
        <span id="rest-sentence">a red ball.</span>
      </div>

      <!-- ตัวเลือก Has / Have -->
      <div class="choices-container">
        <button class="btn-choice btn-has" onclick="selectAnswer('has')">has</button>
        <button class="btn-choice btn-have" onclick="selectAnswer('have')">have</button>
      </div>
    </div>

    <!-- หน้าสรุปผลตอนจบ -->
    <div id="finish-screen" class="finish-screen">
      <div style="font-size: 5rem; animation: bounce 1.5s infinite;">🏆</div>
      <h2 style="font-size: 2rem; color: #2E7D32; margin: 10px 0;">ยอดเยี่ยมมากคนเก่ง!</h2>
      <p style="font-size: 1.3rem; color: #546E7A;">น้องได้คะแนนดาวตอบถูกครั้งแรก:</p>
      <div style="font-size: 2.5rem; font-weight: bold; color: #FFB300;" id="final-score">⭐ 20 / 20</div>
      <br>
      <button class="btn-next" style="background: #29B6F6; box-shadow: 0 4px 0 #0288D1;" onclick="restartGame()">
        🔄 เล่นอีกรอบนะ!
      </button>
    </div>

  </div>

  <!-- Modal Popup เฉลยทันที -->
  <div class="popup-overlay" id="popup">
    <div class="popup-content">
      <div class="popup-icon" id="popup-icon">🎉</div>
      <div class="popup-title" id="popup-title">ถูกต้องจ้า!</div>
      <div class="popup-desc" id="popup-desc">คำอธิบาย</div>
      <button class="btn-next" onclick="closePopup()">ไปข้อต่อไปกันเลย ➔</button>
    </div>
  </div>

  <script>
    // ชุดข้อมูลคำถาม Pronoun 20 ข้อ สำหรับ ป.1
    const quizData = [
      { pronoun: "He", rest: "a red ball.", correct: "has", emoji: "⚽", meaning: "เขา 1 คน (เอกพจน์)" },
      { pronoun: "She", rest: "a cute cat.", correct: "has", emoji: "🐱", meaning: "เธอ 1 คน (เอกพจน์)" },
      { pronoun: "It", rest: "two big ears.", correct: "has", emoji: "🐰", meaning: "มัน 1 ตัว (เอกพจน์)" },
      { pronoun: "I", rest: "a toy car.", correct: "have", emoji: "🚗", meaning: "ฉัน (I เป็นข้อยกเว้นพิเศษเสมอ)" },
      { pronoun: "You", rest: "a sweet apple.", correct: "have", emoji: "🍎", meaning: "เธอ/คุณ (You เป็นแก๊งพหูพจน์)" },
      { pronoun: "We", rest: "a big house.", correct: "have", emoji: "🏡", meaning: "พวกเรา หลายคน (พหูพจน์)" },
      { pronoun: "They", rest: "three balloons.", correct: "have", emoji: "🎈", meaning: "พวกเขา หลายคน (พหูพจน์)" },
      { pronoun: "He", rest: "a shiny robot.", correct: "has", emoji: "🤖", meaning: "เขา 1 คน (เอกพจน์)" },
      { pronoun: "She", rest: "pink shoes.", correct: "has", emoji: "👟", meaning: "เธอ 1 คน (เอกพจน์)" },
      { pronoun: "It", rest: "a long tail.", correct: "has", emoji: "🐒", meaning: "มัน 1 ตัว (เอกพจน์)" },
      { pronoun: "I", rest: "yummy ice cream.", correct: "have", emoji: "🍦", meaning: "ฉัน (I ใช้คู่กับ have เสมอ)" },
      { pronoun: "You", rest: "a blue bicycle.", correct: "have", emoji: "🚲", meaning: "เธอ/คุณ (You ใช้ have จ้า)" },
      { pronoun: "We", rest: "funny books.", correct: "have", emoji: "📚", meaning: "พวกเรา หลายคน (พหูพจน์)" },
      { pronoun: "They", rest: "playful puppies.", correct: "have", emoji: "🐶", meaning: "พวกเขา/พวกมัน หลายตัว (พหูพจน์)" },
      { pronoun: "He", rest: "a lovely guitar.", correct: "has", emoji: "🎸", meaning: "เขา 1 คน (เอกพจน์)" },
      { pronoun: "She", rest: "a pretty flower.", correct: "has", emoji: "🌸", meaning: "เธอ 1 คน (เอกพจน์)" },
      { pronoun: "It", rest: "big green eyes.", correct: "has", emoji: "🐸", meaning: "มัน 1 ตัว (เอกพจน์)" },
      { pronoun: "I", rest: "a brown teddy bear.", correct: "have", emoji: "🧸", meaning: "ฉัน (I ต้องคู่กับ have)" },
      { pronoun: "You", rest: "a yellow umbrella.", correct: "have", emoji: "☂️", meaning: "เธอ/คุณ (You ใช้ have)" },
      { pronoun: "We", rest: "delicious pizzas.", correct: "have", emoji: "🍕", meaning: "พวกเรา หลายคน (พหูพจน์)" }
    ];

    let currentIndex = 0;
    let score = 0;

    // แสดงโจทย์ปัจจุบัน
    function loadQuestion() {
      const q = quizData[currentIndex];
      document.getElementById("current-q-num").innerText = currentIndex + 1;
      document.getElementById("question-emoji").innerText = q.emoji;
      document.getElementById("pronoun").innerText = q.pronoun;
      document.getElementById("blank-answer").innerText = "?";
      document.getElementById("rest-sentence").innerText = q.rest;

      // ปรับ Progress Bar
      const progressPercent = ((currentIndex + 1) / quizData.length) * 100;
      document.getElementById("progress-fill").style.width = progressPercent + "%";
    }

    // เมื่อเด็กกดเลือกคำตอบ
    function selectAnswer(userChoice) {
      const q = quizData[currentIndex];
      const isCorrect = (userChoice === q.correct);

      // ใส่คำตอบเข้าไปในช่องว่างให้เห็นก่อน Popup
      document.getElementById("blank-answer").innerText = userChoice;

      const popup = document.getElementById("popup");
      const icon = document.getElementById("popup-icon");
      const title = document.getElementById("popup-title");
      const desc = document.getElementById("popup-desc");

      if (isCorrect) {
        score++;
        icon.innerText = "🌟";
        title.innerText = "เก่งมาก ถูกต้อง! 🎉";
        title.style.color = "#2E7D32";
        desc.innerHTML = `ประธานคือ <b>"${q.pronoun}"</b> (${q.meaning})<br>จึงต้องใช้ <b>"${q.correct}"</b> จ้า 👏`;
      } else {
        icon.innerText = "💪";
        title.innerText = "เกือบถูกแล้วจ้า! สู้ ๆ";
        title.style.color = "#E64A19";
        desc.innerHTML = `ข้อนี้ต้องตอบว่า <b>"${q.correct}"</b> นะครับ<br>เพราะประธานคือ <b>"${q.pronoun}"</b> (${q.meaning}) นั่นเอง 😊`;
      }

      // แสดง Popup
      popup.classList.add("active");
    }

    // ปิด Popup แล้วไปข้อถัดไป
    function closePopup() {
      const popup = document.getElementById("popup");
      popup.classList.remove("active");

      currentIndex++;
      if (currentIndex < quizData.length) {
        loadQuestion();
      } else {
        showFinishScreen();
      }
    }

    // แสดงหน้าสรุปผล
    function showFinishScreen() {
      document.getElementById("quiz-screen").style.display = "none";
      document.getElementById("finish-screen").style.display = "block";
      document.getElementById("final-score").innerText = `⭐ ${score} / ${quizData.length}`;
    }

    // เริ่มใหม่อีกครั้ง
    function restartGame() {
      currentIndex = 0;
      score = 0;
      document.getElementById("finish-screen").style.display = "none";
      document.getElementById("quiz-screen").style.display = "block";
      loadQuestion();
    }

    // เริ่มทำงานครั้งแรก
    loadQuestion();
  </script>
</body>
</html>
